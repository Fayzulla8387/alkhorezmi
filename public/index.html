<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>8-sinf Computer Science Foundation</title>
<style>
:root{--bg:#f3f6f8;--c:#fff;--t:#14232e;--m:#566672;--p:#0b6e8a;--h:#0f2b3d;--ok:#13794a;--no:#b3261e;--b:#d6dee4;--a:#ffb703}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1a22;--c:#15252f;--t:#e6eef3;--m:#93a6b3;--p:#4fc3e0;--h:#07141b;--ok:#5fd18f;--no:#ff8a80;--b:#26404e}}
:root[data-theme=dark]{--bg:#0e1a22;--c:#15252f;--t:#e6eef3;--m:#93a6b3;--p:#4fc3e0;--h:#07141b;--ok:#5fd18f;--no:#ff8a80;--b:#26404e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--h);color:#fff;padding:12px 16px 10px}.w{max-width:900px;margin:0 auto}.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
h1{font-size:18px;margin:0;cursor:pointer}small{color:#cfe0ea;font-size:13px}.hb{background:none;border:1px solid #ffffff55;color:#fff;border-radius:8px;padding:2px 9px;margin-left:6px}
.bar{height:6px;background:#ffffff33;border-radius:3px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--a);transition:width .4s}
button{font:inherit;color:inherit;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid var(--a);outline-offset:2px}button:disabled{opacity:.5;cursor:not-allowed}
nav{padding:12px 16px 4px}#ch button{background:var(--c);border:1px solid var(--b);border-radius:8px;padding:6px 12px;margin:0 6px 6px 0}#ch .on{background:var(--p);border-color:var(--p);color:#fff}
.n{min-width:38px;height:38px;border-radius:50%;background:var(--c);border:2px solid var(--b);margin:0 6px 6px 0;font-weight:600}.n.d{border-color:var(--ok);background:#13794a22}.n.l{opacity:.55}.n.on{background:var(--a);border-color:var(--a);color:#14232e}
main{padding:8px 16px 40px}.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:16px 18px;margin-bottom:14px}
h2{margin:4px 0 6px;font-size:23px;line-height:1.25}h3{margin:20px 0 8px;font-size:17px}.tag{color:var(--m);font-size:14px;margin:0}li{margin-bottom:6px}.ls p{margin:0 0 10px}
.fact{background:#ffb70322;border-left:4px solid var(--a);padding:8px 12px;border-radius:6px;margin:10px 0}
.qc{border-top:1px solid var(--b);padding:12px 0}.o{display:block;width:100%;text-align:left;background:none;border:1px solid var(--b);border-radius:8px;padding:9px 12px;margin-top:7px}.o:hover{border-color:var(--p)}.o.ok{border-color:var(--ok);background:#13794a22}.o.no{border-color:var(--no);background:#b3261e22}
#r{font-weight:700;margin-top:10px}.tk{display:flex;gap:10px;margin:10px 0;align-items:flex-start}.tk input{margin-top:5px;width:18px;height:18px}
.stp{border:1px solid var(--b);border-radius:10px;padding:12px 14px;margin-top:16px;background:var(--bg)}.nx{display:flex;justify-content:space-between;margin-top:18px}.nx button,.go{background:var(--p);color:#fff;border:0;border-radius:8px;padding:9px 16px}
.f{max-width:440px;margin:20px auto}.f input,.f select{width:100%;padding:10px;margin:4px 0 12px;border:1px solid var(--b);border-radius:8px;background:var(--bg);color:var(--t);font:inherit}.tb button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 10px;font-weight:600}.tb .on{border-color:var(--p)}.er{color:var(--no);min-height:22px}
.sc{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:15px}td,th{border-bottom:1px solid var(--b);padding:7px 8px;text-align:left;white-space:nowrap}.mb{display:inline-block;width:90px;height:8px;background:var(--b);border-radius:4px;vertical-align:middle}.mb i{display:block;height:100%;background:var(--ok);border-radius:4px}
.fl{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}.fl select,.fl input{padding:8px;border:1px solid var(--b);border-radius:8px;background:var(--bg);color:var(--t);font:inherit}
</style></head><body>
<header><div class="w"><div class="top"><h1 onclick="auth.currentUser&&home()">💻 8-sinf Computer Science Foundation</h1><span><small id="who"></small><button class="hb" id="out" hidden onclick="auth.signOut()">Chiqish</button><button class="hb" onclick="tg()" aria-label="Rang">🌓</button></span></div><div class="bar" id="sb" hidden><i id="pr"></i></div><small id="pt"></small></div></header>
<nav class="w" id="nv" hidden><div id="ch"></div><div id="tp"></div></nav>
<main class="w" id="m"></main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script><script src="content.js"></script>
<script>
firebase.initializeApp(firebaseConfig);const auth=firebase.auth(),db=firebase.firestore();
const $=i=>document.getElementById(i),sh=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
const VIL=["Toshkent shahri","Toshkent viloyati","Andijon","Buxoro","Farg'ona","Jizzax","Xorazm","Namangan","Navoiy","Qashqadaryo","Samarqand","Sirdaryo","Surxondaryo","Qoraqalpog'iston Respublikasi"];
// Tuman ro'yxatlari: boshqa viloyatlar uchun ham shu yerga qo'shing, masalan "Andijon":["Asaka","Xonobod",...]
const TUM={"Toshkent shahri":["Bektemir","Chilonzor","Mirobod","Mirzo Ulug'bek","Olmazor","Sergeli","Shayxontohur","Uchtepa","Yakkasaroy","Yashnobod","Yunusobod"]};
const MENTOR="mentor@cs8.uz",MAIL=l=>l.toLowerCase()+"@cs8.uz";
let U=null,P={},S={b:{},t:{},r:{}},cur=-1,ch=0,ok=0,n=0,tot=0,tm,rg=0,A=[],MV={v:"",t:"",q:""};
const tf=k=>[EX[k][1],EX[k][2]?"To'g'ri":"Noto'g'ri",EX[k][2]?"Noto'g'ri":"To'g'ri"];
const tk=i=>T[i][5].every((_,k)=>S.t[i+"-"+k]),dn=i=>!!(S.r[i]&&tk(i)&&S.b[i]>=60),op=i=>i==0||dn(i-1);
function tg(){const d=document.documentElement;d.dataset.theme=(d.dataset.theme=="dark"||(!d.dataset.theme&&matchMedia("(prefers-color-scheme:dark)").matches))?"light":"dark"}
const er=e=>({"auth/email-already-in-use":"Bu login band. Boshqasini tanlang.","auth/weak-password":"Parol kamida 6 belgidan iborat bo'lsin.","auth/invalid-credential":"Login yoki parol noto'g'ri.","auth/wrong-password":"Login yoki parol noto'g'ri.","auth/user-not-found":"Login yoki parol noto'g'ri.","auth/network-request-failed":"Internet yo'q yoki aloqa uzildi."}[e.code]||e.message);
auth.onAuthStateChanged(u=>{if(rg)return;U=u;$("out").hidden=!u;if(!u){$("who").textContent="";return login()}load(u)});
async function load(u){$("nv").hidden=$("sb").hidden=true;$("pt").textContent="";if(u.email==MENTOR){$("who").textContent="Mentor";return mentor()}
const d=await db.collection("students").doc(u.uid).get();P=d.data()||{};S=Object.assign({b:{},t:{},r:{}},P.S||{});$("who").textContent=(P.ism||"")+" · "+(P.tuman||"");$("nv").hidden=$("sb").hidden=false;home()}
function login(m="in"){$("nv").hidden=$("sb").hidden=true;$("pt").textContent="";const T3=[["in","Kirish"],["reg","Ro'yxatdan o'tish"],["mt","Mentor"]];
$("m").innerHTML=`<div class="card f"><div class="tb">${T3.map(x=>`<button class="${x[0]==m?"on":""}" onclick="login('${x[0]}')">${x[1]}</button>`).join("")}</div><br>`+(m=="in"?`<label>Login<input id="lg" autocomplete="username"></label><label>Parol<input id="ps" type="password" autocomplete="current-password"></label><button class="go" onclick="doIn()">Kirish</button>`:m=="mt"?`<p>Mentorlar uchun umumiy parol:</p><input id="ps" type="password"><button class="go" onclick="doMt()">Mentor sifatida kirish</button>`:`<label>Ism va familiya<input id="nm"></label><label>Viloyat<select id="vl" onchange="tm2()"><option value="">Tanlang...</option>${VIL.map(v=>`<option>${v}</option>`).join("")}</select></label><label>Tuman / shahar<span id="tw"><input id="tu" placeholder="Avval viloyatni tanlang"></span></label><label>Login (lotin harf, raqam, _ .)<input id="lg"></label><label>Parol (kamida 6 belgi)<input id="ps" type="password" autocomplete="new-password"></label><button class="go" onclick="doReg()">Ro'yxatdan o'tish</button>`)+`<p class="er" id="er"></p></div>`}
function tm2(){const v=$("vl").value;$("tw").innerHTML=TUM[v]?`<select id="tu"><option value="">Tanlang...</option>${TUM[v].map(x=>`<option>${x}</option>`).join("")}</select>`:`<input id="tu" placeholder="Tuman nomini yozing">`}
const E=t=>$("er").textContent=t,V=i=>$(i).value.trim();
async function doIn(){try{await auth.signInWithEmailAndPassword(MAIL(V("lg")),$("ps").value)}catch(e){E(er(e))}}
async function doMt(){try{await auth.signInWithEmailAndPassword(MENTOR,$("ps").value)}catch(e){E("Parol noto'g'ri.")}}
async function doReg(){const nm=V("nm"),vl=V("vl"),tu=V("tu"),lg=V("lg").toLowerCase();if(nm.length<3||!vl||!tu)return E("Ism, viloyat va tumanni to'ldiring.");if(!/^[a-z0-9_.]{3,20}$/.test(lg))return E("Login 3–20 ta lotin harf, raqam, _ yoki . bo'lsin.");
rg=1;try{const c=await auth.createUserWithEmailAndPassword(MAIL(lg),$("ps").value);const tn=tu[0].toUpperCase()+tu.slice(1);await db.collection("students").doc(c.user.uid).set({ism:nm,viloyat:vl,tuman:tn,login:lg,S:{b:{},t:{},r:{}},done:0,avg:0,ts:Date.now(),created:Date.now()});rg=0;U=c.user;$("out").hidden=false;load(c.user)}catch(e){rg=0;E(er(e))}}
function sv(){clearTimeout(tm);tm=setTimeout(()=>{const v=Object.values(S.b),d=T.filter((_,i)=>dn(i)).length;db.collection("students").doc(U.uid).set({S,done:d,avg:v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length):0,ts:Date.now()},{merge:true}).catch(()=>{})},500)}
function nav(){$("ch").innerHTML=C.map((c,k)=>`<button class="${k==ch?"on":""}" onclick="ch=${k};nav()">${R[k]} bob</button>`).join("");
$("tp").innerHTML=T.map((t,i)=>t[0]==ch?`<button class="n ${i==cur?"on":""} ${dn(i)?"d":""} ${op(i)?"":"l"}" ${op(i)?"":"disabled"} aria-label="${i+1}-mavzu" onclick="show(${i})">${op(i)?i+1:"🔒"}</button>`:"").join("");
const d=T.filter((_,i)=>dn(i)).length;$("pr").style.width=d/26*100+"%";$("pt").textContent=d+"/26 mavzu to'liq tugatildi"}
function home(){cur=-1;nav();const nx=T.findIndex((_,i)=>!dn(i));$("m").innerHTML=`<div class="card"><h2>Salom, ${P.ism||""}! 👋</h2><p>Computer Science Foundation — 8-sinf kursi: kompyuter savodxonligi, internet, kiberxavfsizlik, Git/GitHub va Flowgorithm'da algoritmlash.</p><table><tr><th>Bob</th><th>Soat</th></tr><tr><td>I. ${C[0]}</td><td>6</td></tr><tr><td>II. ${C[1]}</td><td>13</td></tr><tr><td>III. ${C[2]}</td><td>17</td></tr></table><h3>Tartib va baholash</h3><ul><li>36 mashg'ulot, 12 hafta, haftasiga 3 marta (1 soat 20 daqiqa).</li><li>Joriy nazorat — 40, oraliq — 20, yakuniy — 100 ball; yakuniy nazoratga qo'yilish uchun 60 balldan kamida 36 ball kerak.</li><li><b>Keyingi mavzu</b> darsni o'qib chiqib, barcha topshiriqlarni bajarib, quizdan kamida 60% olgandan keyin ochiladi.</li><li>Natijangiz mentorga ko'rinadi va avtomatik saqlanadi.</li></ul>${nx<0?`<p><b>🎉 Tabriklaymiz, kursni tugatdingiz!</b></p>`:`<button class="go" onclick="show(${nx})">${nx?nx+1+"-mavzudan davom etish":"1-mavzudan boshlash"}</button>`}</div>`}
function show(i){if(!op(i))return;cur=i;ch=T[i][0];const t=T[i],qs=i==25?sh(T.slice(0,25).flatMap(x=>x[4]).concat(EX.map((_,k)=>tf(k)))).slice(0,10):t[4].concat([tf(i)]);ok=n=0;tot=qs.length;nav();
$("m").innerHTML=`<div class="card"><p class="tag">${R[ch]} bob · ${C[ch]} · ${t[2]} soat</p><h2>${i+1}. ${t[1]}</h2><div class="fact">💡 <b>Bilasizmi?</b> ${EX[i][0]}</div><h3>📘 Asosiy tushunchalar</h3><ul>${t[3].map(p=>`<li>${p}</li>`).join("")}</ul><h3>📖 Batafsil dars</h3><div class="ls">${D[i].split("|").map(p=>`<p>${p}</p>`).join("")}</div><label class="tk"><input type="checkbox" ${S.r[i]?"checked":""} onchange="S.r[${i}]=this.checked?1:0;sv();st()"><span><b>Darsni to'liq o'qib chiqdim</b></span></label><h3>❓ Quiz${i==25?" (10 ta aralash savol)":" (savollar soni: "+qs.length+")"}</h3><div id="q">${qs.map((q,k)=>`<div class="qc"><b>${k+1}. ${q[0]}</b>${sh(q.slice(1).map((o,j)=>[o,j==0])).map(o=>`<button class="o" data-c="${o[1]?1:0}" onclick="pick(this)">${o[0]}</button>`).join("")}</div>`).join("")}</div><div id="r"></div><h3>📝 Topshiriqlar</h3>${t[5].map((x,k)=>`<label class="tk"><input type="checkbox" ${S.t[i+"-"+k]?"checked":""} onchange="S.t['${i}-${k}']=this.checked?1:0;sv();st()"><span>${x}</span></label>`).join("")}<div id="st" class="stp"></div><div class="nx"><span>${i>0?`<button onclick="show(${i-1})">← Oldingi</button>`:""}</span><span>${i<25?`<button id="nb" onclick="show(${i+1})">Keyingi →</button>`:""}</span></div></div>`;st();scrollTo(0,0)}
function pick(b){const p=b.parentNode;if(p.dataset.d)return;p.dataset.d=1;n++;[...p.querySelectorAll(".o")].forEach(x=>{if(x.dataset.c==1)x.classList.add("ok")});if(b.dataset.c==1)ok++;else b.classList.add("no");
if(n==tot){const s=Math.round(ok/tot*100);S.b[cur]=Math.max(S.b[cur]||0,s);sv();$("r").innerHTML=`Natija: ${ok}/${tot} (${s}%) ${s>=60?"— quiz topshirildi ✅":"— o'tish uchun kamida 60% kerak. Darsni qayta o'qib, yana urinib ko'ring."} <button class="go" onclick="show(cur)">🔄 Qayta urinish</button>`;st()}}
function st(){const i=cur,e=$("st");if(!e)return;const a=!!S.r[i],b=S.b[i]>=60,c=tk(i),d=a&&b&&c;e.innerHTML=`<b>${d?"✅ Mavzu tugatildi!":"Keyingi mavzu ochilishi uchun:"}</b><br>${a?"✅":"⬜"} Darsni o'qib chiqish<br>${b?"✅":"⬜"} Quizdan kamida 60% olish${S.b[i]!=null?` (eng yaxshi natija: ${S.b[i]}%)`:""}<br>${c?"✅":"⬜"} Barcha topshiriqlarni bajarish`;const nb=$("nb");if(nb){nb.disabled=!d;nb.textContent=d?"Keyingi →":"🔒 Keyingi"}nav()}
async function mentor(){$("m").innerHTML=`<p>Yuklanmoqda...</p>`;try{A=(await db.collection("students").get()).docs.map(d=>d.data())}catch(e){return $("m").innerHTML=`<p class="er">Ma'lumot olinmadi: ${e.message}</p>`}mv()}
function mv(){const f=A.filter(r=>(!MV.v||r.viloyat==MV.v)&&(!MV.t||r.tuman==MV.t)&&(!MV.q||(r.ism+r.login).toLowerCase().includes(MV.q.toLowerCase()))).sort((a,b)=>b.done-a.done||b.avg-a.avg),ts=[...new Set(A.filter(r=>!MV.v||r.viloyat==MV.v).map(r=>r.tuman))].sort();
$("m").innerHTML=`<div class="card"><h2>👩‍🏫 Mentor paneli</h2><div class="fl"><select onchange="MV.v=this.value;MV.t='';mv()"><option value="">Barcha viloyatlar</option>${VIL.map(v=>`<option ${v==MV.v?"selected":""}>${v}</option>`).join("")}</select><select onchange="MV.t=this.value;mv()"><option value="">Barcha tumanlar</option>${ts.map(v=>`<option ${v==MV.t?"selected":""}>${v}</option>`).join("")}</select><input placeholder="Ism yoki login" value="${MV.q}" onchange="MV.q=this.value;mv()"><button class="go" onclick="csv()">⬇ CSV</button><button class="go" onclick="mentor()">🔄 Yangilash</button></div><p>O'quvchilar: <b>${f.length}</b> · o'rtacha bosqich: <b>${f.length?(f.reduce((a,r)=>a+r.done,0)/f.length).toFixed(1):0}/26</b></p><div class="sc"><table><tr><th>#</th><th>Ism</th><th>Login</th><th>Hudud</th><th>Bosqich</th><th>Hozir</th><th>Quiz o'rt.</th><th>Oxirgi faollik</th></tr>${f.map((r,k)=>`<tr><td>${k+1}</td><td>${r.ism}</td><td>${r.login}</td><td>${r.viloyat}, ${r.tuman}</td><td><span class="mb"><i style="width:${r.done/26*100}%"></i></span> ${r.done}/26</td><td>${r.done>=26?"Tugatdi 🎉":Math.min(r.done+1,26)+"-mavzu ("+R[T[Math.min(r.done,25)][0]]+" bob)"}</td><td>${r.avg}%</td><td>${new Date(r.ts).toLocaleDateString("uz")}</td></tr>`).join("")}</table></div></div>`}
function csv(){const f=A.filter(r=>(!MV.v||r.viloyat==MV.v)&&(!MV.t||r.tuman==MV.t)),L=["Ism,Login,Viloyat,Tuman,Tugatilgan mavzu,Quiz o'rtachasi %"].concat(f.map(r=>[r.ism,r.login,r.viloyat,r.tuman,r.done,r.avg].map(x=>`"${x}"`).join(",")));const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+L.join("\n")],{type:"text/csv"}));a.download="oquvchilar.csv";a.click()}
</script></body></html>
