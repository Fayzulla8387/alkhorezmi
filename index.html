<script>
const C=["Kompyuter savodxonligi va arxitekturasi","Zamonaviy IT yo'nalishlari va raqamli infratuzilma","Algoritmlash, Flowgorithm va dasturlash"],R=["I","II","III"];
// [bob, mavzu, soat, tushunchalar, quiz[savol, to'g'ri, xato, xato], topshiriqlar]
const T=[
[0,"Zamonaviy kompyuterlar va ularning arxitekturasi",1,["Kompyuter turlari: shaxsiy kompyuter, noutbuk, server, planshet, smartfon.","Asosiy qismlar: protsessor (CPU) hisoblaydi, RAM vaqtinchalik xotira, HDD/SSD doimiy saqlaydi.","Kiritish (klaviatura, sichqoncha) va chiqarish (monitor, printer) qurilmalari; texnik ko'rsatkichlar: chastota, RAM va xotira hajmi."],[["Kompyuterning 'miyasi' qaysi qurilma?","Protsessor","Monitor","Sichqoncha"],["Elektr o'chganda RAM'dagi ma'lumot nima bo'ladi?","Yo'qoladi","Saqlanib qoladi","SSD'ga o'tadi"]],["Kompyuteringiz yoki telefoningizning texnik ko'rsatkichlarini (protsessor, RAM, xotira) yozib oling.","Kompyuter qurilmalari sxemasini chizing va har birining vazifasini yozing."]],
[0,"Operatsion tizimlar va Windows muhitida ishlash",1,["Operatsion tizim (OT) apparat va dasturlarni boshqaradigan asosiy dastur.","Turlari: Windows, Linux, macOS (kompyuter); Android, iOS (mobil).","Windows: ish stoli, Start menyusi, oynalar, Sozlamalar va Boshqaruv paneli; dasturlarni o'rnatish va o'chirish."],[["Qaysi biri operatsion tizim EMAS?","Chrome brauzeri","Linux","macOS"],["Dasturni o'chirish qayerdan bajariladi?","Sozlamalar › Ilovalar","Ish stoli rasmini o'chirib","Printer sozlamalaridan"]],["Windows'da fon rasmini almashtiring va Start menyusiga bitta dasturni qadang.","3 ta operatsion tizimni solishtiruvchi jadval tuzing."]],
[0,"Axborot o'lchov birliklari va fayl turlari. Fayl va papkalar, tezkor tugmalar",1,["1 bayt = 8 bit; 1 KB = 1024 bayt; 1 MB = 1024 KB; 1 GB = 1024 MB; 1 TB = 1024 GB.","Fayl kengaytmalari: .docx (hujjat), .jpg (rasm), .mp3 (audio), .pdf, .exe (dastur).","Tezkor tugmalar: Ctrl+C nusxa, Ctrl+X qirqish, Ctrl+V qo'yish, Ctrl+Z bekor qilish, F2 nomini o'zgartirish, Delete o'chirish."],[["1 KB necha baytga teng?","1024","100","8"],["Faylni qirqib olish tugmalari?","Ctrl+X","Ctrl+C","Ctrl+Z"]],["Ish stolida 'Sinf' papkasi yarating: ichida 3 ta fan papkasi va har birida bittadan matn fayli bo'lsin.","Fayllarni faqat tezkor tugmalar bilan nusxalang, ko'chiring va nomini o'zgartiring."]],
[0,"Kompyuterning asosiy va qo'shimcha qurilmalari",1,["Asosiy: tizim bloki, monitor, klaviatura, sichqoncha.","Tizim bloki ichida: protsessor, RAM, ona plata, HDD/SSD.","Qo'shimcha: printer, skaner, proyektor, veb-kamera, kolonka. Qurilmalarni ulashda xavfsizlik qoidalariga rioya qiling."],[["Barcha qurilmalar ulanadigan asosiy plata?","Ona plata","Protsessor","Printer"],["Skaner qaysi turdagi qurilma?","Kiritish","Chiqarish","Saqlash"]],["Kiritish, chiqarish va saqlash qurilmalarini 3 ustunli jadvalga joylashtiring.","Kompyuterning asosiy qurilmalari haqida 5 slaydli interaktiv taqdimot tayyorlang."]],
[0,"Internet, brauzerlar va elektron pochta bilan ishlash",1,["Internet — dunyo kompyuterlarini bog'lovchi tarmoq; xizmatlari: veb, pochta, video, bulutli xizmatlar.","Brauzerlar: Chrome, Edge, Firefox, Safari. Qidiruvda aniq kalit so'zlardan foydalaning.","Elektron pochta: manzil (nom@domen), mavzu, matn, fayl biriktirish. Shubhali xatlarni ochmang."],[["Qaysi biri brauzer?","Firefox","Excel","Telegram"],["Elektron pochta manzili qaysi ko'rinishda?","ism@gmail.com","www.ism.com","ism#gmail"]],["Gmail akkaunt yarating va o'qituvchingizga mavzusi bor, fayl biriktirilgan rasmiy xat yuboring.","Bitta mavzuni 3 xil kalit so'z bilan qidirib, natijalarni solishtiring."]],
[0,"Kompyuter xavfsizligi va antivirus dasturlari",1,["Zararli dasturlar: virus, trojan, spyware, ransomware.","Antivirus zararli dasturlarni aniqlaydi va yo'q qiladi; uni yangilab turing.","Kuchli parol (12+ belgi, harf, raqam, belgi) va 2FA; noma'lum fleshka va havolalardan ehtiyot bo'ling."],[["Fayllarni shifrlab, pul talab qiladigan zararli dastur?","Ransomware","Spyware","Antivirus"],["2FA nima?","Ikki bosqichli tasdiqlash","Ikkita antivirus o'rnatish","Parolni ikki marta yozish"]],["Kuchli parol qoidalari bo'yicha eslatma kartochkasi tayyorlang.","Kompyuter viruslari va antivirus dasturlari bo'yicha prezentatsiya tayyorlang."]],
[1,"Klaviaturada tez va to'g'ri yozish ko'nikmalari",1,["Klaviatura guruhlari: harflar, raqamlar, funksiya (F1–F12), boshqaruv (Ctrl, Alt, Shift), strelkalar.","To'g'ri o'tirish: orqa tik, tirsaklar taxminan 90°, ekran ko'z balandligida.","Touch typing: 10 barmoq, qo'llar asosiy qatorda (ASDF JKL;), tugmalarga qaramasdan yozish."],[["Touch typing'da barmoqlar qaysi qatorda turadi?","Asosiy (ASDF–JKL;) qator","Raqamlar qatori","Pastki qator"],["Tezlikni oshirishning eng yaxshi yo'li?","Muntazam mashq","Tugmalarga qarab yozish","Bitta barmoq bilan yozish"]],["Har kuni 15 daqiqa mashq qiling; boshida va 1 haftadan keyin tezligingizni (so'z/daqiqa) yozing.","Berilgan matnni xatosiz yozing va xatolar sonini hisoblang."]],
[1,"Raqamli savodxonlik va raqamli madaniyat",1,["Raqamli savodxonlik — texnologiyalardan samarali va xavfsiz foydalanish, axborotni baholash ko'nikmasi.","Raqamli iz — internetda qoldirgan har bir ma'lumotingiz; shaxsiy ma'lumotni ulashishdan oldin o'ylang.","Internetda odob bilan muloqot qiling; feyk axborotni manbasi, sanasi va muallifiga qarab aniqlang."],[["Raqamli iz nima?","Internetda qoldirgan ma'lumotlar","Klaviaturadagi barmoq izi","Fayl nomi"],["Gumonli xabarni tarqatishdan oldin nima qilinadi?","Manbasi tekshiriladi","Do'stlarga yuboriladi","Layk bosiladi"]],["Raqamli madaniyat va internet xavfsizligi bo'yicha infografika yarating.","Bitta mish-mish xabarni 3 ta ishonchli manba bilan tekshiring va xulosa yozing."]],
[1,"Raqamli transformatsiya tushunchasi",1,["Raqamli transformatsiya — ta'lim, biznes va davlat xizmatlarini raqamli texnologiyalar bilan yangilash.","Misollar: onlayn xizmatlar, avtomatlashtirish, elektron hujjat aylanishi.","Afzalliklari: tezkorlik, qulaylik, samaradorlik; xavfsizlik va moslashuvchanlik ham muhim."],[["Qaysi biri raqamli transformatsiya misoli?","Davlat xizmatini onlayn olish","Arizani qog'ozda qo'lda yozish","Navbatda turish"],["Elektron hujjat aylanishining afzalligi?","Tezkorlik va qulaylik","Qog'oz sarfi ortishi","Sekin ishlash"]],["Maktabingizdagi bir jarayonni (masalan, davomat) raqamlashtirish bo'yicha 5 ta g'oya yozing (aqliy hujum).","Oilangiz foydalanadigan 3 ta onlayn xizmat va ularning afzalligini yozing."]],
[1,"Internet qanday ishlaydi? IP, hosting, domen, DNS, brauzer, HTTP/HTTPS",1,["IP-manzil — qurilmaning tarmoqdagi raqamli manzili; domen — saytning odam o'qiy oladigan nomi; hosting — sayt fayllari saqlanadigan server.","DNS domen nomini IP-manzilga aylantiradi (telefon kitobiga o'xshaydi).","Sahifa ochilishi: brauzer so'rov yuboradi → DNS manzilni topadi → server javob beradi. HTTPS ma'lumotni shifrlaydi (qulf belgisi)."],[["Domenni IP-manzilga aylantiruvchi tizim?","DNS","HTTP","SSD"],["Xavfsiz (shifrlangan) ulanishni ta'minlaydigan protokol?","HTTPS","HTTP","DNS"]],["Brauzerdagi qulf belgisini bosib, 3 ta saytning HTTPS holatini tekshiring.","Veb-sahifa ochilish bosqichlarini (brauzer → DNS → server → sahifa) sxema qilib chizing."]],
[1,"Bulutli xizmatlar va onlayn hamkorlik vositalari",3,["Bulutli xizmat — ma'lumotni internetdagi serverda saqlash (Google Drive, OneDrive, Dropbox).","Onlayn hujjatlar: Google Docs, Sheets, Slides, Microsoft 365 — bir vaqtda birgalikda tahrirlash mumkin.","Ulashish ruxsatlari: ko'rish, izoh qoldirish, tahrirlash. Vazifalar: Microsoft To Do, Google Tasks, Trello."],[["Google Drive qaysi turdagi xizmat?","Bulutli saqlash","Antivirus","Brauzer"],["Hujjatni faqat o'qish uchun ulashadigan ruxsat?","Ko'ruvchi (Viewer)","Muharrir (Editor)","Egasi"]],["Google Docs'da hujjat yarating va sinfdoshingizga 'izoh qoldirish' ruxsati bilan ulashing.","Trello yoki Google Tasks'da bir haftalik o'quv rejangizni vazifalar ro'yxati qilib tuzing.","Juftlikda bitta mavzu bo'yicha Google Slides taqdimot tayyorlang."]],
[1,"Git va GitHub bilan tanishuv",4,["Git — o'zgarishlarni kuzatuvchi versiyalarni boshqarish tizimi; GitHub — repozitoriylarni onlayn saqlash platformasi.","Tushunchalar: repository, commit, branch, README.md.","Buyruqlar: git init, add, commit, status, log, clone, push, pull."],[["O'zgarishni saqlash nuqtasini yaratadigan buyruq?","git commit","git clone","git log"],["Fayllarni commit uchun tayyorlaydigan buyruq?","git add","git push","git pull"]],["GitHub akkaunt yarating va README.md bilan 'portfolio' repozitoriysini oching.","Lokal papkada git init qiling, kamida 3 ta commit bajaring, git log natijasini ko'rsating va push qiling.","Sinfdoshingizning ochiq repozitoriysini clone qiling."]],
[1,"Zamonaviy IT yo'nalishlari: Web, Mobile, Data Science, AI, DevOps, Cybersecurity",1,["Web va Mobile dasturlash: sayt va ilovalar yaratish.","Data Science — ma'lumotlardan xulosa chiqarish; AI va Machine Learning — kompyuterni misollar asosida o'rgatish.","DevOps — server va bulutli infratuzilma; Cybersecurity — axborotni himoya qilish."],[["Ma'lumotlarni tahlil qilib xulosa chiqarish qaysi yo'nalish?","Data Science","Mobile dasturlash","DevOps"],["Axborotni hujumlardan himoya qilish yo'nalishi?","Cybersecurity","Data Science","Web dasturlash"]],["Bitta yo'nalishni tanlab, 'Kim bo'lib ishlayman va nimalarni o'rganaman?' mavzusida bir sahifa yozing.","Har bir yo'nalish uchun 1 tadan mashhur mahsulot misolini toping."]],
[1,"Kiberxavfsizlik va shaxsiy ma'lumotlarni himoya qilish asoslari",1,["Xavflar: phishing (soxta xat yoki sayt), zararli havolalar, ijtimoiy muhandislik.","Himoya: kuchli va noyob parol, 2FA, dasturlarni muntazam yangilash.","Parol, karta raqami, manzilni begonalarga bermang; ommaviy Wi-Fi'da ehtiyot bo'ling."],[["Soxta sayt orqali parol o'g'irlash usuli?","Phishing","Backup","Formatlash"],["Qaysi parol eng kuchli?","T7#kP9!vQ2m","12345678","ismim2010"]],["Akkauntlaringizda 2FA yoqing (imkon bo'lganlarida) va natijani yozing.","Phishing xatining 5 ta belgisini jadvalga yozing."]],
[2,"Algoritm tushunchasi va algoritmik fikrlash",1,["Algoritm — maqsadga erishish uchun aniq va tartibli amallar ketma-ketligi.","Xossalari: aniqlik, ketma-ketlik, natijaviylik.","Algoritmik fikrlash — masalani kichik bosqichlarga ajratish."],[["Algoritmning xossasi qaysi?","Aniqlik","Tasodifiylik","Cheksizlik"],["Algoritmik fikrlashning birinchi qadami?","Masalani bosqichlarga ajratish","Darrov kod yozish","Yechimni taxmin qilish"]],["'Choy damlash' algoritmini aniq qadamlar bilan yozing.","'Maktabga tayyorlanish' algoritmini 8 qadamda tuzing."]],
[2,"Flowgorithm interfeysi va blok-sxema elementlari bilan ishlash",1,["Flowgorithm — algoritmlarni blok-sxema ko'rinishida yaratadigan bepul dastur.","Elementlar: Start/End, Input (kiritish), Output (chiqarish), Process (hisoblash), Decision (shart).","Bloklarni joylashtiring, ulang, Run bilan ishga tushiring va natijani tekshiring."],[["Shartni tekshiruvchi blok?","Decision","Output","Start"],["Foydalanuvchidan qiymat oladigan blok?","Input","Process","End"]],["'Salom, dunyo!' chiqaradigan birinchi sxemani yarating.","Ismni so'rab, «Salom, ism!» chiqaradigan algoritm tuzing."]],
[2,"Flowgorithm orqali dasturlash tushunchalari: dastur, buyruq, kod va mantiq",1,["Dastur — kompyuter bajaradigan buyruqlar to'plami; kod — buyruqlarning yozilgan ko'rinishi.","Algoritm g'oyani, kod esa uni dasturlash tilida ifodalaydi.","Dastur mantiqi: kiritish → qayta ishlash → natija chiqarish."],[["Dastur mantiqining to'g'ri tartibi?","Kiritish → ishlash → chiqarish","Chiqarish → kiritish → ishlash","Ishlash → chiqarish → kiritish"],["Algoritm va kod orasidagi bog'liqlik?","Kod algoritmning dasturdagi ifodasi","Ular bir-biriga aloqasiz","Algoritm koddan keyin yoziladi"]],["Ikki son yig'indisini Input–Process–Output ko'rinishida yozing va Flowgorithm'da yarating.","Oddiy dastur namunasini tahlil qilib, har bir blokning vazifasini yozing."]],
[2,"Flowgorithm'da o'zgaruvchilar va ma'lumot turlari bilan ishlash",1,["O'zgaruvchi — qiymat saqlanadigan nomlangan xotira joyi.","Turlari: Integer (butun), Real (haqiqiy), String (matn), Boolean (mantiqiy).","Input orqali qiymat olib o'zgaruvchiga saqlang va oddiy hisoblashlarni bajaring."],[["Ism qaysi turda saqlanadi?","String","Integer","Boolean"],["True/False qiymatlar turi?","Boolean","Integer","String"]],["Ism va yoshni kiritib, 5 yildan keyingi yoshni chiqaradigan dastur yarating.","Har bir tur uchun bittadan o'zgaruvchi yarating va qiymatlarini chiqaring."]],
[2,"Flowgorithm'da chiziqli algoritmlar yaratish",1,["Chiziqli algoritm — amallar yuqoridan pastga, shartsiz va takrorsiz bajariladi.","Input → Process → Output bloklari bilan yig'indi, ayirma, ko'paytma, bo'linma hisoblanadi.","Formulalar: yuza = a·b, perimetr = 2(a+b), o'rtacha = (a+b)/2, foiz = qism/butun·100."],[["To'g'ri to'rtburchak yuzasi formulasi?","a·b","2(a+b)","a+b"],["Ikki sonning o'rtachasi?","(a+b)/2","a·b","a−b"]],["To'g'ri to'rtburchakning yuzi va perimetrini hisoblovchi sxema yarating.","Tug'ilgan yildan yoshni hisoblaydigan dastur yarating."]],
[2,"Flowgorithm'da tarmoqlanuvchi algoritmlar va shartlar bilan ishlash",2,["Decision bloki shartga qarab 'Ha' (True) yoki 'Yo'q' (False) yo'lni tanlaydi.","Taqqoslash: &gt;, &lt;, &gt;=, &lt;=, ==, !=; mantiqiy: AND, OR, NOT.","Misollar: juft/toq son, musbat/manfiy son, bahoni aniqlash (if/else)."],[["Butun x sonning juftlik sharti?","x % 2 == 0","x % 2 != 0","x / 2 == 0"],["'Ikkala shart ham to'g'ri bo'lsa' qaysi operator?","AND","OR","NOT"]],["Son juft yoki toq ekanini aniqlovchi algoritm yarating.","Ball bo'yicha baho (5/4/3/2) chiqaruvchi sxema yarating, murakkab shartlardan foydalaning."]],
[2,"Flowgorithm'da takrorlanuvchi algoritmlar va sikllar bilan ishlash",2,["Sikl amallarni bir necha marta takrorlaydi.","For — takrorlar soni ma'lum bo'lganda; While — shart to'g'ri bo'lguncha.","Misollar: 1 dan N gacha sonlar, yig'indi, ko'paytma. Sikl hisoblagichi va shartini tekshiring."],[["Takrorlar soni oldindan ma'lum bo'lsa qaysi sikl qulay?","For","Decision","Output"],["Sikl sharti hech qachon yolg'on bo'lmasa nima bo'ladi?","Cheksiz sikl","Dastur tezlashadi","Sikl o'tkazib yuboriladi"]],["1 dan N gacha sonlar yig'indisini sikl bilan hisoblang.","N sonning faktorialini (ko'paytma) hisoblovchi sxema yarating."]],
[2,"Flowgorithm'da «Kalkulyator» loyihasini yaratish",2,["Maqsad: ikki son va amal (+, −, ×, ÷) kiritilib, natija chiqariladi.","Tanlangan amal Decision bloklari orqali tekshiriladi.","Nolga bo'lishda xato xabarini chiqaring va loyihani turli sonlar bilan test qiling."],[["Kalkulyatorda qaysi holat alohida tekshiriladi?","Nolga bo'lish","Qo'shish","Ayirish"],["Tanlangan amalni aniqlash uchun qaysi blok kerak?","Decision","Start","Output"]],["To'liq kalkulyator loyihasini yarating va 5 ta test holatini yozing.","Qo'shimcha: daraja yoki qoldiq amalini qo'shing."]],
[2,"Flowgorithm'da «Talaba baholash tizimi» loyihasini yaratish",2,["Davomat, uyga vazifa, amaliy ish va test ballari kiritiladi.","Umumiy ball va foiz hisoblanadi.","Decision orqali baho aniqlanadi: a'lo, yaxshi, qoniqarli, qoniqarsiz; noto'g'ri ball tekshiriladi."],[["Foiz qanday hisoblanadi?","To'plangan ball / maksimal ball × 100","Ball + maksimal ball","Ball − maksimal ball"],["Noto'g'ri ball (masalan, −5) kiritilsa nima qilinadi?","Xato xabari chiqarilib, qayta so'raladi","Hisoblash davom etadi","Dastur o'chiriladi"]],["O'zingiz belgilagan mezonlar bilan baholash tizimini yarating.","10 ta turli ball bilan sinab, natijalar jadvalini tuzing."]],

const D=[`Kompyuter — ma'lumotni qabul qiladigan, qayta ishlaydigan, saqlaydigan va natijani chiqaradigan qurilma. U ko'p turda bo'ladi: shaxsiy kompyuter ish stolida turadi, noutbuk ko'chma, server boshqa kompyuterlarga xizmat qiladi, planshet va smartfon cho'ntakka sig'adi.|Protsessor (CPU) barcha hisob-kitoblarni bajaradi, shuning uchun uni kompyuterning 'miyasi' deyishadi. RAM — tezkor, lekin vaqtinchalik xotira: elektr o'chsa, undagi ma'lumot yo'qoladi. HDD yoki SSD esa fayllarni doimiy saqlaydi. Protsessor chastotasi (GHz), RAM va xotira hajmi (GB) kompyuter qanchalik kuchli ekanini ko'rsatadi.`,`Operatsion tizim (OT) — kompyuter yoqilganda birinchi ishga tushadigan va qurilmalar bilan dasturlarni boshqaradigan asosiy dastur. OTsiz kompyuterda hech qaysi dastur ishlamaydi. Kompyuterlar uchun Windows, Linux va macOS, telefonlar uchun Android va iOS ishlatiladi.|Windows'da ish stoli — asosiy ishchi maydon, Start menyusi — dasturlar ro'yxati; oynalarni kattalashtirish, kichraytirish va yopish mumkin. Sozlamalar bo'limida fon, ekran va ilovalarni boshqarasiz. Dasturni o'chirish: Sozlamalar › Ilovalar. Brauzer (masalan, Chrome) esa OT emas, oddiy dastur.`,`Kompyuterda eng kichik axborot birligi — bit (0 yoki 1). 8 bit = 1 bayt. Keyin: 1 KB = 1024 bayt, 1 MB = 1024 KB, 1 GB = 1024 MB, 1 TB = 1024 GB. Masalan, bitta rasm bir necha MB, film esa bir necha GB joy egallaydi.|Fayl — nomi va kengaytmasi bor ma'lumot: hisobot.docx, rasm.jpg, qoshiq.mp3. Papka fayllarni tartibda saqlash uchun kerak. Tezkor tugmalar vaqtni tejaydi: Ctrl+C (nusxa), Ctrl+V (qo'yish), Ctrl+X (qirqish), Ctrl+Z (bekor qilish), F2 (nomini o'zgartirish), Delete (o'chirish).`,`Kompyuterning asosiy qurilmalari: tizim bloki (ichida hamma narsa), monitor (tasvir), klaviatura va sichqoncha (kiritish). Tizim blokining ichida protsessor, RAM, HDD/SSD va hammasini birlashtiradigan ona plata joylashgan.|Qurilmalar uch vazifaga bo'linadi: kiritish (klaviatura, sichqoncha, skaner, veb-kamera), chiqarish (monitor, printer, kolonka, proyektor) va saqlash (HDD, SSD, fleshka). Qurilmani ulashdan oldin simlarni tekshiring, nam qo'l bilan simga tegmang, simni tortib uzmang.`,`Internet — butun dunyodagi kompyuterlarni bir-biriga bog'laydigan tarmoq. U orqali sayt ko'rish, xat yozish, video ko'rish, fayl yuklash mumkin. Internetga kirish uchun brauzer ishlatiladi: Chrome, Edge, Firefox, Safari.|Qidirishda aniq kalit so'zlar yozing; aniq ibora uchun qo'shtirnoqdan foydalaning. Elektron pochta manzili ism@domen ko'rinishida bo'ladi (masalan, ism@gmail.com). Xatda kimga, mavzu va matn to'ldiriladi, kerak bo'lsa fayl biriktiriladi. Noma'lum jo'natuvchining havola va fayllarini ochmang.`,`Zararli dasturlar kompyuterga zarar yetkazadi. Virus o'zini ko'paytirib fayllarni buzadi, trojan foydali dastur niqobida kiradi, spyware sizni yashirincha kuzatadi, ransomware esa fayllarni shifrlab, ochish uchun pul talab qiladi.|Himoya: antivirus o'rnating va yangilab turing; parolni kamida 12 belgidan, harf, raqam va belgilar aralash qiling; 2FA (ikki bosqichli tasdiqlash)ni yoqing. Noma'lum fleshka va gumonli havolalarni ochmang, dasturlarni faqat ishonchli manbadan yuklang.`,`Klaviatura tugmalari guruhlarga bo'lingan: harflar, raqamlar, funksiya tugmalari (F1–F12), boshqaruv tugmalari (Ctrl, Alt, Shift) va strelkalar. To'g'ri o'tirish sog'liq uchun muhim: orqa tik, tirsaklar taxminan 90°, ekran ko'z balandligida bo'lsin.|Touch typing — 10 barmoq bilan, tugmalarga qaramay yozish usuli. Barmoqlar asosiy qatorda turadi: chap qo'lda A S D F, o'ng qo'lda J K L ;. Tezlik va aniqlik muntazam mashq bilan oshadi; avval aniqlikka, keyin tezlikka e'tibor bering.`,`Raqamli savodxonlik — texnologiyalardan samarali va xavfsiz foydalanish hamda axborotni baholay olish. Raqamli madaniyat — internetda odob bilan o'zini tutish: hurmat bilan yozish, haqorat qilmaslik, boshqalarning ma'lumotini ruxsatsiz tarqatmaslik.|Siz internetda qoldirgan har bir iz (rasm, izoh, qidiruv) — raqamli iz, u uzoq saqlanadi. Shaxsiy ma'lumotni ulashishdan oldin o'ylang. Feyk (yolg'on) xabarni aniqlash uchun manbasini, sanasini, muallifini tekshiring va boshqa ishonchli saytlar bilan solishtiring.`,`Raqamli transformatsiya — ta'lim, biznes va davlat xizmatlarining qog'ozdan raqamli ko'rinishga o'tishi. Masalan: hujjatni davlat xizmatlari portalida onlayn olish, to'lovni telefon orqali qilish, elektron jurnal.|Onlayn xizmatlar va elektron hujjat aylanishi vaqtni tejaydi va xatoni kamaytiradi: afzalliklari — tezkorlik, qulaylik, samaradorlik. Biroq shaxsiy ma'lumotlar xavfsizligi va yangi texnologiyaga moslashish ham muhim.`,`Har bir qurilma internetda IP-manzil bilan aniqlanadi (raqamlardan iborat). Odamlar raqamni emas, domen nomini (masalan, example.uz) eslab qoladi. Hosting — saytning fayllari saqlanadigan va doim internetga ulangan server.|DNS domen nomini IP-manzilga aylantiradi — xuddi telefon kitobi ismdan raqamni topgandek. Sahifa ochilishi: siz manzil yozasiz → brauzer DNS'dan IP-manzilni oladi → serverga so'rov yuboradi → server sahifani yuboradi. HTTP ma'lumotni ochiq yuboradi, HTTPS esa shifrlaydi; manzil yonidagi qulf belgisi xavfsiz ulanishni bildiradi.`,`Bulutli xizmat — fayllarni kompyuterda emas, internetdagi serverda saqlash. Google Drive, OneDrive, Dropbox shunday xizmatlar. Afzalligi: fayllarga istalgan qurilmadan kirish mumkin va qurilma buzilsa ham ma'lumot yo'qolmaydi.|Google Docs, Sheets, Slides va Microsoft 365 da bir hujjatni bir necha kishi bir vaqtda tahrirlaydi. Ulashganda ruxsatni tanlang: Ko'ruvchi (faqat o'qiydi), Izoh qoldiruvchi, Muharrir (o'zgartiradi). Vazifalarni boshqarish uchun Microsoft To Do, Google Tasks va Trello ishlatiladi.`,`Git — fayllaringizdagi o'zgarishlarni kuzatadigan va eski versiyaga qaytarish imkonini beradigan tizim. GitHub — Git loyihalari (repozitoriylar)ni internetda saqlaydigan va ulashadigan sayt. Commit — o'zgarishlarning saqlangan nuqtasi, branch — alohida tarmoq, README.md — loyiha tavsifi.|Asosiy buyruqlar: git init (repozitoriy yaratish), git add (fayllarni tayyorlash), git commit (saqlash), git status (holat), git log (tarix), git clone (nusxa olish), git push (GitHub'ga yuborish), git pull (yangilanishni olish). Odatiy tartib: add → commit → push.`,`Web dasturlash — saytlar yaratish, Mobile — telefon ilovalari yaratish. Data Science ma'lumotlarni tahlil qilib xulosa chiqaradi. AI (sun'iy intellekt) odam kabi fikrlaydigan tizimlar yaratadi, Machine Learning esa kompyuterni misollar bilan o'rgatadi.|DevOps mutaxassislari serverlar va bulutli infratuzilmani ishlatib turadi. Cybersecurity mutaxassislari ma'lumotni hujumlardan himoya qiladi. Bu yo'nalishlarning hammasi dasturlash va algoritmik fikrlashga asoslanadi.`,`Phishing — soxta xat, SMS yoki sayt orqali parol va karta ma'lumotini o'g'irlash. Belgilari: shoshiltiradi, g'alati manzil, imlo xatolari, parol so'raydi. Ijtimoiy muhandislik — odamni aldab sir aytdirish.|Himoya: har sayt uchun alohida kuchli parol (T7#kP9!vQ2m kabi), 2FA, yangilanishlar. Parol, karta kodi va SMS kodni hech kimga aytmang. Ommaviy Wi-Fi'da bank ilovalaridan foydalanmang. Gumonli havolani bosmang.`,`Algoritm — muammoni yechish uchun aniq, tartibli qadamlar. Kundalik misol: choy damlash — choynak to'ldiriladi, qaynatiladi, choy solinadi, kutiladi. Yaxshi algoritm aniq (har qadam tushunarli), ketma-ket va natijali (oxirida javob beradi) bo'ladi.|Algoritmik fikrlash — katta masalani kichik bosqichlarga ajratish. Avval masalani tushuning, keyin bosqichlarga bo'ling, har bosqichni qadam-baqadam yozing va oxirida tekshiring.`,`Flowgorithm — algoritmni kod yozmasdan, blok-sxema bilan yaratish va ishga tushirish dasturi. Sxema Start bilan boshlanadi va End bilan tugaydi. Input — ma'lumot kiritish, Output — natija chiqarish, Process — hisoblash va qiymat berish, Decision — shart tekshirish (Ha/Yo'q).|Bloklarni sichqoncha bilan qo'shing va to'ldiring. Run tugmasi bilan ishga tushiring, natijani tekshiring; xato bo'lsa blokni topib tuzating.`,`Dastur — kompyuter bajaradigan buyruqlar ro'yxati. Kod — shu buyruqlar dasturlash tilida yozilgan ko'rinishi. Algoritm g'oya, kod esa uning dasturdagi ifodasi.|Har bir dastur: kiritish (ma'lumot olish) → qayta ishlash (hisoblash) → chiqarish (natijani ko'rsatish) tartibida ishlaydi. Flowgorithm'da bu Input → Process → Output bloklari bilan ifodalanadi.`,`O'zgaruvchi — qiymat saqlanadigan nomi bor 'quti'. Unga nom beriladi (masalan, yosh) va qiymat yoziladi; keyin qiymatni o'zgartirish mumkin. Turlari: Integer — butun son (14), Real — kasr son (3.5), String — matn (Ali), Boolean — True/False.|Flowgorithm'da Declare bloki bilan o'zgaruvchi yaratiladi, Input bilan qiymat kiritiladi, Assign (Process) bilan hisoblanadi. Masalan: yosh2 = yosh + 5.`,`Chiziqli algoritm — hamma amallar yuqoridan pastga bir marta, shartsiz bajariladi: Input → Process → Output. Masalan, ikki son yig'indisi: sonlarni kiriting, qo'shing, natijani chiqaring.|Foydali formulalar: to'g'ri to'rtburchak yuzi = a·b, perimetri = 2(a+b), ikki son o'rtachasi = (a+b)/2, foiz = qism / butun × 100. Natijani oddiy sonlar bilan sinab tekshiring.`,`Tarmoqlanuvchi algoritmda Decision bloki shartni tekshiradi: shart to'g'ri bo'lsa 'Ha' (True) yo'li, yolg'on bo'lsa 'Yo'q' (False) yo'li bajariladi. Taqqoslash: &gt; katta, &lt; kichik, &gt;= katta yoki teng, &lt;= kichik yoki teng, == teng, != teng emas.|Murakkab shart AND (ikkalasi to'g'ri), OR (kamida bittasi to'g'ri), NOT (teskari) bilan tuziladi. Juft son: x % 2 == 0 (2 ga bo'lgandagi qoldiq 0). Baho aniqlashda shartlar ketma-ket tekshiriladi.`,`Sikl — bir xil amallarni takrorlash. For sikli takrorlar soni oldindan ma'lum bo'lganda ishlatiladi (masalan, 1 dan 10 gacha). While sikli shart to'g'ri bo'lguncha takrorlaydi.|Masalan, 1 dan N gacha yig'indi: s = 0, har qadamda s = s + i. Faktorial uchun ko'paytma ishlatiladi. Sikldagi hisoblagich o'zgarmasa, shart hech qachon yolg'on bo'lmaydi va cheksiz sikl hosil bo'ladi.`,`Kalkulyator loyihasi: 1) ikki son va amal belgisini kiriting; 2) Decision bloklari bilan amal turini tekshiring (+, −, ×, ÷); 3) natijani chiqaring.|Bo'lishda ikkinchi son 0 bo'lsa, xato xabari chiqarilishi shart, chunki nolga bo'lish mumkin emas. Tugatgach 5 ta testni sinang: oddiy sonlar, manfiy sonlar, kasr, nolga bo'lish.`,`Talaba baholash tizimi: davomat, uyga vazifa, amaliy ish va test ballarini kiriting, ularni qo'shib umumiy ballni toping. Foiz = to'plangan ball / maksimal ball × 100.|Keyin Decision bloklari bilan bahoni aniqlang: a'lo, yaxshi, qoniqarli yoki qoniqarsiz (mezonlarni o'zingiz belgilaysiz). Ball manfiy yoki maksimaldan katta bo'lsa, xato xabarini chiqarib, qayta kiritishni so'rang.`,`Mini bankomat: balans o'zgaruvchisida pul saqlanadi. Menyu: 1 — balansni ko'rish, 2 — pul yechish, 3 — pul kiritish, 4 — chiqish. Menyu sikl ichida bo'lib, 4 tanlanmaguncha qayta chiqadi.|Pul yechishda Decision bilan so'ralgan summa balansdan oshmasligini tekshiring: yetmasa mablag' yetarli emasligini xabar qiling. Pul kiritishda balansga qo'shing, yechishda ayiring.`,`Login va parol tizimi: to'g'ri login va parolni oldindan o'zgaruvchilarda belgilab qo'ying. Foydalanuvchi kiritganini solishtiring: login to'g'ri AND parol to'g'ri bo'lsagina kirish ruxsat etiladi.|Xato urinishlarni hisoblagich bilan sanang; 3 marta xato qilinsa, tizim kirishni to'xtatsin. Muvaffaqiyatli kirishda salomlashuv xabarini chiqaring.`,`Yakuniy nazorat — kursdagi bilimlaringizni tekshiradi: 25 yopiq test (3 balldan = 75 ball) va 5 ochiq savol yoki amaliy topshiriq (5 balldan = 25 ball). Yakuniy nazoratga qo'yilish uchun joriy va oraliq nazoratdan jami 60 balldan kamida 36 ball kerak.|Tayyorlanish: 1) har bobning Asosiy tushunchalar va Batafsil dars qismlarini qayta o'qing; 2) quyidagi aralash testni bir necha marta yeching; 3) Flowgorithm loyihalarini o'zingiz qayta yarating.`];;

const XD={
0:`<b>Protsessor (CPU) tafsiloti.</b> CPU — Central Processing Unit, ya'ni dastur buyruqlarini bajaradigan asosiy mikrosxema. U buyruqni xotiradan oladi, tushunadi (dekodlaydi) va bajaradi — bu jarayon soniyasiga milliardlab marta takrorlanadi. Muhim ko'rsatkichlar: yadrolar soni (core), oqimlar (thread), chastota (GHz) va kesh xotira (L1, L2, L3). Ko'p yadroli protsessor bir vaqtda bir nechta vazifani bajaradi. Ishlab chiqaruvchilar: Intel, AMD, Apple (M seriyasi), telefonlarda Qualcomm.|<b>Grafik protsessor (GPU).</b> GPU — Graphics Processing Unit. Unda minglab kichik yadro bo'lib, bir xil amalni juda ko'p ma'lumotga parallel bajaradi: o'yin grafikasi, video, 3D va sun'iy intellektni o'qitish. Ikki turi bor: integratsiyalashgan (protsessor ichida, tejamkor) va alohida videokarta (NVIDIA, AMD Radeon — kuchli, ko'proq elektr talab qiladi).|<div class="sc"><table><tr><th>Mezon</th><th>CPU</th><th>GPU</th></tr><tr><td>Yadrolar</td><td>Oz (4–32), kuchli</td><td>Minglab, oddiy</td></tr><tr><td>Vazifa</td><td>Umumiy hisoblash, tizimni boshqarish</td><td>Grafika, parallel hisoblash, AI</td></tr><tr><td>Ishlash usuli</td><td>Ketma-ket, murakkab buyruqlar</td><td>Parallel, bir xil amallar</td></tr><tr><td>Misol</td><td>Intel Core, AMD Ryzen</td><td>NVIDIA GeForce, AMD Radeon</td></tr></table></div>|<b>Xotira ierarxiyasi.</b> Tezlikdan sekinga: kesh → RAM (DDR4/DDR5) → SSD → HDD. Tezroq xotira qimmat va hajmi kichik, sekinrog'i arzon va katta. SSD flesh-xotirada ishlaydi, harakatlanuvchi qismi yo'q, shuning uchun HDD'dan tez va zarbaga chidamli. Ona plata barcha qismlarni ulaydi, blok pitaniya (PSU) elektr beradi, kuler esa qizishdan saqlaydi.|<b>Fon Neyman arxitekturasi (1945).</b> Dastur va ma'lumotlar bitta xotirada saqlanadi. Asosiy qismlar: arifmetik-mantiq qurilmasi (ALU), boshqaruv qurilmasi, xotira, kiritish va chiqarish qurilmalari. Hozirgi kompyuterlar shu g'oyaga asoslangan.`,
2:`<b>Nima uchun ikkilik tizim?</b> Kompyuter ichida elektr signali ikki holatda bo'ladi: bor (1) yoki yo'q (0). Shuning uchun hamma ma'lumot — matn, rasm, video — 0 va 1 ketma-ketligida saqlanadi. Ikkilikni o'nlikka o'tkazish: 101 = 1·4 + 0·2 + 1·1 = 5. Bir bayt (8 bit) 256 xil qiymat (0–255) saqlaydi, shu sababli bir belgi taxminan bir bayt joy oladi. Unicode (UTF-8) o'zbek harflarini va emojilarni ham saqlay oladi.|<b>Hajm hisoblash.</b> 1 KB = 1024 bayt, shuning uchun 2 KB = 2048 bayt. 16 GB flesh-xotira = 16 · 1024 = 16 384 MB. Kattaroq birlikdan kichigiga o'tishda 1024 ga ko'paytiriladi, teskarisida bo'linadi.|<b>Fayl kengaytmalari.</b> Kengaytma nomdagi nuqtadan keyingi qism bo'lib, faylni qaysi dastur ochishini ko'rsatadi.|<div class="sc"><table><tr><th>Tur</th><th>Kengaytmalar</th></tr><tr><td>Hujjat</td><td>.docx, .pdf, .txt, .pptx, .xlsx</td></tr><tr><td>Rasm</td><td>.jpg, .png, .gif, .svg</td></tr><tr><td>Audio</td><td>.mp3, .wav</td></tr><tr><td>Video</td><td>.mp4, .avi, .mkv</td></tr><tr><td>Arxiv</td><td>.zip, .rar</td></tr><tr><td>Dastur</td><td>.exe (Windows), .apk (Android)</td></tr><tr><td>Veb va kod</td><td>.html, .css, .js, .py</td></tr></table></div>|<b>Formatlar farqi.</b> JPG — fotosuratlar uchun, siqilgan (sifat biroz kamayadi). PNG — shaffof fon, sifat yo'qolmaydi. GIF — oddiy animatsiya. SVG — vektor rasm, kattalashganda xiralashmaydi. MP3 — siqilgan audio, WAV — siqilmagan, hajmi katta. ZIP fayllarni siqib bitta arxivga yig'adi.|<b>Xavfsizlik va qoidalar.</b> Kengaytmani qo'lda o'zgartirish (rasm.jpg → rasm.docx) faylni konvertatsiya qilmaydi, faqat ochilmay qolishiga olib kelishi mumkin. Konvertatsiya uchun dastur kerak. Kengaytmalarni ko'rish: Fayllar oynasi › Ko'rinish › Fayl nomi kengaytmalari. Ikki kengaytmali fayl (foto.jpg.exe) virus belgisi bo'lishi mumkin. Fayl nomida \\ / : * ? < > belgilari ishlatilmaydi.`

$("m").innerHTML=`<div class="card"><h2>👩‍🏫 Mentor paneli</h2><div class="fl"><select onchange="MV.v=this.value;MV.t='';mv()"><option value="">Barcha viloyatlar</option>${VIL.map(v=>`<option ${v==MV.v?"selected":""}>${v}</option>`).join("")}</select><select onchange="MV.t=this.value;mv()"><option value="">Barcha tumanlar</option>${ts.map(v=>`<option ${v==MV.t?"selected":""}>${v}</option>`).join("")}</select><input placeholder="Ism yoki login" value="${MV.q}" onchange="MV.q=this.value;mv()"><button class="go" onclick="csv()">⬇ CSV</button><button class="go" onclick="mentor()">🔄 Yangilash</button></div><p>O'quvchilar: <b>${f.length}</b> · o'rtacha bosqich: <b>${f.length?(f.reduce((a,r)=>a+r.done,0)/f.length).toFixed(1):0}/26</b></p><div class="sc"><table><tr><th>#</th><th>Ism</th><th>Login</th><th>Hudud</th><th>Bosqich</th><th>Hozir</th><th>Quiz o'rt.</th><th>Oxirgi faollik</th><th>Amallar</th></tr>${f.map((r,k)=>`<tr><td>${k+1}</td><td>${r.ism}</td><td>${r.login}</td><td>${r.viloyat}, ${r.tuman}</td><td><span class="mb"><i style="width:${r.done/26*100}%"></i></span> ${r.done}/26</td><td>${r.done>=26?"Tugatdi 🎉":Math.min(r.done+1,26)+"-mavzu ("+R[T[Math.min(r.done,25)][0]]+" bob)"}</td><td>${r.avg}%</td><td>${new Date(r.ts).toLocaleDateString("uz")}</td><td><button class="go" title="O'chirish" onclick="del('${r.id}')">🗑</button></td></tr>`).join("")}</table></div></div>`}
function csv(){const f=A.filter(r=>(!MV.v||r.viloyat==MV.v)&&(!MV.t||r.tuman==MV.t)),L=["Ism,Login,Viloyat,Tuman,Tugatilgan mavzu,Quiz o'rtachasi %"].concat(f.map(r=>[r.ism,r.login,r.viloyat,r.tuman,r.done,r.avg].map(x=>`"${x}"`).join(",")));const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+L.join("\n")],{type:"text/csv"}));a.download="oquvchilar.csv";a.click()}
function prof(){cur=-1;$("m").innerHTML=`<div class="card f"><h2>✏️ Profilni tahrirlash</h2><p class="er" id="er"></p><label>Ism</label><input id="pn" value="${P.ism||""}"><label>Viloyat</label><select id="pv">${VIL.map(v=>`<option ${v==P.viloyat?"selected":""}>${v}</option>`).join("")}</select><label>Tuman</label><input id="pu" value="${P.tuman||""}"><label>Yangi parol (o'zgartirmasangiz bo'sh qoldiring)</label><input id="p1" type="password" autocomplete="new-password"><label>Hozirgi parol (faqat parolni o'zgartirishda kerak)</label><input id="p0" type="password" autocomplete="current-password"><button class="go" onclick="psv()">Saqlash</button> <button class="go" onclick="home()">Bekor qilish</button></div>`}
async function psv(){const nm=V("pn"),tu=V("pu"),vl=$("pv").value,p1=$("p1").value;if(!nm||!tu)return E("Ism va tumanni to'ldiring.");if(p1&&p1.length<6)return E("Parol kamida 6 belgidan iborat bo'lsin.");
try{if(p1){if(window.DEMO)return E("Demo rejimda parolni o'zgartirib bo'lmaydi.");await U.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(U.email,$("p0").value));await U.updatePassword(p1)}
const tn=tu[0].toUpperCase()+tu.slice(1);await db.collection("students").doc(U.uid).set({ism:nm,viloyat:vl,tuman:tn},{merge:true});Object.assign(P,{ism:nm,viloyat:vl,tuman:tn});$("who").textContent=nm+" · "+tn;home()}catch(e){E(er(e))}}
async function del(id){const r=A.find(x=>x.id==id);if(!confirm(r.ism+" ("+r.login+") o'chirilsinmi? Buni qaytarib bo'lmaydi."))return;
try{await db.collection("students").doc(id).delete();A=A.filter(x=>x.id!=id);mv()}catch(e){alert("O'chirilmadi: "+(e.message||e))}}
</script></body></html>
